[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchos-tect-synquanon"
version = "0.1.0"
description = "Reproducible experiment and evidence workspace for superconducting quantum metamaterials"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
researchos = "researchos.cli:main"

[tool.setuptools.packages.find]
include = ["researchos*"]
