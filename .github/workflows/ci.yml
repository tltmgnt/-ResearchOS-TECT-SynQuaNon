name: Verify research workspace
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check web/app.js
      - run: node web/tests/model.test.cjs
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: researchos validate examples/synthetic-qubit.json
      - run: researchos run examples/synthetic-qubit.json --output runs/demo.json
      - run: researchos report runs/demo.json > runs/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-python-${{ matrix.python }}
          path: runs/
